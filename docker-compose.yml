# ===========================================================================
# Polaris — Unified Docker Compose (Local + Production)
# ===========================================================================
# Single compose file for all environments. Everything runs in Docker.
# Local dev and production use the same stack — what works here works there.
#
# Usage:
#   docker compose up -d                    # Start everything
#   docker compose up -d --build polaris    # Rebuild app after code changes
#   docker compose logs -f polaris          # View app logs
#
# Services:
#   - polaris        (port 8501) — Streamlit chat UI
#   - trino          (port 8090) — Federated query engine
#   - openmetadata   (port 8585) — Metadata catalog
#   - om-mysql       (internal)  — OpenMetadata backend DB
#   - om-elasticsearch (internal) — OpenMetadata search
#
# Data source databases (MySQL, PostgreSQL, MongoDB, Redis) are expected
# to be reachable from the Docker network. For local dev, add them to
# this compose file or use `extra_hosts` to reach host services.
# ===========================================================================

services:
  # =========================================================================
  # Polaris Application
  # =========================================================================
  polaris:
    build: .
    container_name: polaris-app
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - OPENMETADATA_URL=http://openmetadata:8585
      - TRINO_CATALOG_DIR=/app/trino-catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./infra/trino/catalog:/app/trino-catalog
    depends_on:
      trino:
        condition: service_healthy
      openmetadata:
        condition: service_healthy
    networks:
      - polaris-net
    restart: unless-stopped

  # =========================================================================
  # Trino Query Engine
  # =========================================================================
  trino:
    image: trinodb/trino:439
    container_name: polaris-trino
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/trino/etc:/etc/trino
      - ./infra/trino/catalog:/etc/trino/catalog
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - polaris-net
    restart: unless-stopped

  # =========================================================================
  # OpenMetadata Server
  # =========================================================================
  openmetadata-migrate:
    image: docker.getcollate.io/openmetadata/server:1.4.8
    container_name: polaris-openmetadata-migrate
    command: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh", "migrate"]
    environment:
      OPENMETADATA_CLUSTER_NAME: "polaris"
      SERVER_HOST_API_URL: "http://openmetadata:8585/api"
      DB_DRIVER_CLASS: "com.mysql.cj.jdbc.Driver"
      DB_SCHEME: "mysql"
      DB_HOST: om-mysql
      DB_PORT: "3306"
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata_pass
      DB_NAME: openmetadata_db
      ELASTICSEARCH_HOST: om-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: "http"
      AUTHENTICATION_PROVIDER: "basic"
      AUTHENTICATION_PUBLIC_KEYS: '[http://openmetadata:8585/api/v1/system/config/jwks]'
      AUTHORIZER_CLASS_NAME: "org.openmetadata.service.security.DefaultAuthorizer"
      AUTHORIZER_REQUEST_FILTER: "org.openmetadata.service.security.JwtFilter"
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
    networks:
      - polaris-net
    restart: "no"

  openmetadata:
    image: docker.getcollate.io/openmetadata/server:1.4.8
    container_name: polaris-openmetadata
    ports:
      - "8585:8585"
    environment:
      OPENMETADATA_CLUSTER_NAME: "polaris"
      SERVER_HOST_API_URL: "http://openmetadata:8585/api"
      DB_DRIVER_CLASS: "com.mysql.cj.jdbc.Driver"
      DB_SCHEME: "mysql"
      DB_HOST: om-mysql
      DB_PORT: "3306"
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata_pass
      DB_NAME: openmetadata_db
      ELASTICSEARCH_HOST: om-elasticsearch
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: "http"
      AUTHENTICATION_PROVIDER: "basic"
      AUTHENTICATION_PUBLIC_KEYS: '[http://openmetadata:8585/api/v1/system/config/jwks]'
      AUTHORIZER_CLASS_NAME: "org.openmetadata.service.security.DefaultAuthorizer"
      AUTHORIZER_REQUEST_FILTER: "org.openmetadata.service.security.JwtFilter"
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_PRINCIPAL_DOMAIN: "open-metadata.org"
      PIPELINE_SERVICE_CLIENT_ENABLED: "false"
    depends_on:
      om-mysql:
        condition: service_healthy
      om-elasticsearch:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8585/api/v1/system/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - polaris-net
    restart: unless-stopped

  # =========================================================================
  # OpenMetadata Dependencies
  # =========================================================================
  om-mysql:
    image: mysql:8.0
    container_name: polaris-om-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata_pass
    volumes:
      - om-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - polaris-net
    restart: unless-stopped

  om-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: polaris-om-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - om-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - polaris-net
    restart: unless-stopped

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  om-mysql-data:
  om-es-data:

# ===========================================================================
# Networks
# ===========================================================================
networks:
  polaris-net:
    driver: bridge
